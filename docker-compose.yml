services:
  otternel:
    build: .
    container_name: service-otternel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SERVERLOG_FOLDER=/serverlog
    volumes:
      # TODO : REPLACE WITH A PROXY TO AVOID GIVING DOCKER ACCESS TO THE HOST FILE SYSTEM ASAP
      - /var/run/docker.sock:/var/run/docker.sock
      # Read only server logs
      - /opt/docker/minecraft/la_vanilla_s4/data/logs:/serverlog/499m2bs21q0xa52:ro
      - /opt/docker/minecraft/isle_of_berk/data/logs:/serverlog/72gty67zb339942:ro
      # Read only server stats
      - /opt/docker/minecraft/isle_of_berk/data/world/stats:/stats/72gty67zb339942/:ro
      - /opt/docker/minecraft/la_vanilla_s4/data/world/players/stats:/stats/499m2bs21q0xa52/:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pocketbase_network
      - server-net

networks:
  pocketbase_network:
    external: true
    name: pocketbase_network
  server-net:
    external: true
    name: server-net